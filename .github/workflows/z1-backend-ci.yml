name: Zadanie 1 - Backend CI

on:
  push:
    branches: ["zadanie-1", "feat/z1-**"]
  pull_request:
    branches: ["zadanie-1", "main"]

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'pull_request' || github.base_ref == 'zadanie-1' || startsWith(github.head_ref, 'zadanie-1')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose up -d --build --wait --wait-timeout 240
      - run: python tests/smoke_compose.py
      - if: failure()
        run: docker compose logs --no-color --tail=100
      - if: always()
        run: docker compose down -v
